{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | FelloMarley Foundation</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="{% static 'images/logo.PNG' %}" rel="icon" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <div class="min-h-screen flex items-center justify-center px-4 py-16">

        <div class="max-w-lg w-full text-center">

            <span class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-blue-100 text-blue-600 text-3xl">
                <i class="fa-solid fa-compass"></i>
            </span>

            <p class="mt-8 text-sm font-black uppercase tracking-[0.3em] text-blue-600">Error 404</p>

            <h1 class="mt-4 text-4xl sm:text-5xl font-black text-slate-900 leading-tight">
                We could not find that page
            </h1>

            <p class="mt-5 text-slate-600 leading-7">
                The link may be broken, or the page may have been moved. The pages
                below will get you back on track.
            </p>

            <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">

                <a href="/"
                   class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-500 transition">
                    <i class="fa-solid fa-house text-xs"></i> Back to home
                </a>

                <a href="/about/"
                   class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-slate-100 text-slate-700 font-bold hover:bg-slate-200 transition">
                    <i class="fa-solid fa-user text-xs"></i> About the author
                </a>

            </div>

            <p class="mt-10 text-sm text-slate-400">
                Need something else? <a href="/#contact" class="text-blue-600 font-semibold hover:underline">Get in touch</a>
            </p>

        </div>

    </div>

</body>
</html>

{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong | FelloMarley Foundation</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="{% static 'images/logo.PNG' %}" rel="icon" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <div class="min-h-screen flex items-center justify-center px-4 py-16">

        <div class="max-w-lg w-full text-center">

            <span class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-rose-100 text-rose-600 text-3xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </span>

            <p class="mt-8 text-sm font-black uppercase tracking-[0.3em] text-rose-600">Error 500</p>

            <h1 class="mt-4 text-4xl sm:text-5xl font-black text-slate-900 leading-tight">
                Something went wrong
            </h1>

            <p class="mt-5 text-slate-600 leading-7">
                The server hit an unexpected problem while handling that request.
                The team has been notified, please try again in a moment.
            </p>

            <div class="mt-10 flex flex-col sm:flex-row gap-4 justify-center">

                <a href="/"
                   class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-500 transition">
                    <i class="fa-solid fa-house text-xs"></i> Back to home
                </a>

                <a href="/#contact"
                   class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-slate-100 text-slate-700 font-bold hover:bg-slate-200 transition">
                    <i class="fa-solid fa-paper-plane text-xs"></i> Report the problem
                </a>

            </div>

        </div>

    </div>

</body>
</html>

{% extends "header.html" %}
{% block content %}
        {% include "sidebar.html" %}

{% for y in contacts %}
    

    

<div class="flex flex-col sm:ml-64 h-screen">

    <!-- Scrollable Content -->
    <main class="flex-1 overflow-y-auto p-6">    <h1 class="text-3xl font-bold mb-4">Contact Details</h1>
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <p><strong>Name:</strong> {{ y.name }}</p>
        <p><strong>Email:</strong> {{ y.email }}</p>
        <p><strong>Phone:</strong> {{ y.phone }}</p>
        <p><strong>Message:</strong> {{ y.message }}</p>
    </div>
    {% endfor %}
</main>
</div>
{% include "footer.html" %}
{% endblock content %}
